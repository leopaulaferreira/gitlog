name: gitlog

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gitlog}
      POSTGRES_USER: ${POSTGRES_USER:-gitlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  metabase-db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.63.18
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_SITE_LOCALE: pt_BR
      MB_REPORT_TIMEZONE: UTC
      JAVA_TIMEZONE: UTC
      JAVA_OPTS: -Xmx1g
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  dbt:
    build: ./docker/dbt
    profiles: [tools]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DBT_HOST: postgres
      DBT_USER: ${DBT_USER:-gitlog_dbt}
      DBT_ENV_SECRET_PASSWORD: ${DBT_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gitlog}
      HOME: /tmp
    volumes:
      - ./dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metabase_data:
  postgres_data:
