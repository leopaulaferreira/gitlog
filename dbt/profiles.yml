gitlog:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'gitlog_dbt') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'gitlog') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
      retries: 1
