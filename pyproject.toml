[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlog"
version = "0.1.0"
description = "Turning GitHub activity into structured data and actionable insights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "black>=25.1,<27",
]

[project.scripts]
gitlog = "ingestion.main:main"

[tool.setuptools.packages.find]
include = ["ingestion*"]

[tool.setuptools.package-data]
"ingestion.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires the isolated PostgreSQL test container"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py312"]
line-length = 88
