# GitLog Metabase virtual host. Include in the existing Nginx conf.d configuration.
server {
    listen 80;
    server_name gitlog.leofe.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gitlog.leofe.com.br;

    ssl_certificate     /etc/letsencrypt/live/gitlog.leofe.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitlog.leofe.com.br/privkey.pem;

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $metabase_upstream metabase:3000;
        proxy_pass http://$metabase_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_buffering off;
    }
}
